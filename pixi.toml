[workspace]
channels = ["conda-forge"]
name = "gencad_env"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
# We need a python version that is compatible with pytorch
python = ">=3.10,<3.13"
pythonocc-core = "7.9.0.*"
pip = "*"

[pypi-dependencies]
torch = "*"
torchvision = "*"
transformers = "*"
opencv-python = "*"
scikit-learn = "*"
x-clip = "*"
ema-pytorch = "*"
tensorboardx = "*"
tensorboard = "*"
einops = "*"
h5py = "*"
plyfile = "*"
trimesh = "*"
matplotlib = "*"

[feature.gpu.system-requirements]
cuda = "12.8"

[feature.gpu.pypi-dependencies]
torch = { version = ">=2.8.0", index = "https://download.pytorch.org/whl/test/cu128" }
torchvision = { version = "*", index = "https://download.pytorch.org/whl/test/cu128" }
triton = { version = "*", index = "https://download.pytorch.org/whl/test/cu128" }

[feature.cpu.pypi-dependencies]
torch = { version = "*" }
torchvision = { version = "*" }

[environments]
gpu = { features = ["gpu"] }
cpu = { features = ["cpu"] }
# Make CPU the default environment
default = { features = ["cpu"] }
